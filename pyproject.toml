[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camoufox-mcp"
version = "0.1.0"
description = "MCP server for browser automation using Camoufox"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "camoufox-mcp contributors" }]
keywords = ["mcp", "browser-automation", "camoufox", "playwright", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "camoufox[geoip]>=0.5.7",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "ulid-py>=1.1.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
camoufox-mcp = "camoufox_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/camoufox-mcp/camoufox-mcp"
Repository = "https://github.com/camoufox-mcp/camoufox-mcp"
Issues = "https://github.com/camoufox-mcp/camoufox-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["camoufox_mcp"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/camoufox_mcp"]
omit = ["tests/*"]
